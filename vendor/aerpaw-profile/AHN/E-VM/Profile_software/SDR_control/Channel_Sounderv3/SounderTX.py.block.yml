id: SounderTX
label: SounderTX
category: '[GRC Hier Blocks]'

parameters:
-   id: alpha
    label: alpha
    dtype: real
    default: '0.99'
    hide: none
-   id: freq
    label: freq
    dtype: real
    default: '0'
    hide: none
-   id: samp_rate
    label: Sample Rate
    dtype: real
    default: 2e6
    hide: none
-   id: sps
    label: sps
    dtype: int
    default: '16'
    hide: none

inputs: []

outputs:
-   label: out
    dtype: complex
    vlen: 1

templates:
    imports: 'from SounderTX import SounderTX  # grc-generated hier_block'
    make: "SounderTX(\n    alpha=${ alpha },\n    freq=${ freq },\n    samp_rate=${\
        \ samp_rate },\n    sps=${ sps },\n)"
    callbacks:
    - set_alpha(${ alpha })
    - set_freq(${ freq })
    - set_samp_rate(${ samp_rate })
    - set_sps(${ sps })

documentation: /root/.grc_gnuradio/SounderTX.py
grc_source: /root/Profiles/SDR_control/Channel_Sounderv3/SounderTX.grc

file_format: 1
